name: errcheck
version: 1.20.0
summary: Unchecked error checker for go programs
description: |
  errcheck is a program for checking for unchecked errors in go programs.
license: MIT

base: core24
confinement: strict
grade: stable

apps:
  errcheck:
    environment:
      # go puts build cache files in GOCACHE which is normally $HOME/.cache but
      # we need to use the SNAP specific location - similarly go now generates
      # local telemetry which is normally in $XDG_CONFIG_HOME which defaults to $HOME/.config
      GOCACHE: $SNAP_USER_DATA/.cache/go-build
      XDG_CONFIG_HOME: $SNAP_USER_DATA/.config
    command: bin/errcheck
    plugs:
      - home
      - network

parts:
  errcheck:
    plugin: go
    source: https://github.com/kisielk/errcheck.git
    source-tag: v$CRAFT_PROJECT_VERSION
    build-packages:
      - git
      - gcc
    build-snaps:
      - go/latest/stable
    stage-snaps:
      - go/latest/stable
